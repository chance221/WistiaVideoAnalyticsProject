[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wistia-video-analytics"
version = "0.1.0"
description = "Wistia Video Analytics Medallion Pipeline (Bronze, Silver, Quarantine, Gold)"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
lambda = [
    "backoff>=2.2.1,<3.0.0",
    "requests>=2.31.0,<3.0.0",
]
dev = [
    "backoff>=2.2.1,<3.0.0",
    "boto3>=1.34.0",
    "requests>=2.31.0,<3.0.0",
    "pytest>=8.0.0",
    "build>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "config*"]
exclude = ["scripts.raw*"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
