JobName: WistiaMedallionGlueJob
Description: >
  Weekly Medallion PySpark + Apache Iceberg SCD Type 1 job that validates Bronze S3 JSON
  via Pydantic, routes invalid records to Quarantine, and upserts Silver and Gold Iceberg tables.
GlueVersion: "5.0"
WorkerType: G.1X
NumberOfWorkers: 2
Timeout: 30
ExecutionClass: FLEX
Command:
  Name: glueetl
  PythonVersion: "3"
  ScriptLocation: s3://wistia-pipeline-project/artifacts/glue/glue_spark.py
DefaultArguments:
  "--job-language": "python"
  "--datalake-formats": "iceberg"
  "--job-bookmark-option": "job-bookmark-disable"
  "--enable-metrics": "true"
  "--enable-continuous-cloudwatch-log": "true"
  "--enable-glue-datacatalog": "true"
  "--TempDir": "s3://wistia-pipeline-project/glue-temp/"
  "--ENV": "prod"
  "--conf": "spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO --conf spark.sql.catalog.glue_catalog.warehouse=s3://wistia-pipeline-project/"
